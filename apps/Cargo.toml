[workspace]
resolver = "2"
members = [
    # 核心组件
    "crates/core/err_code",
    "crates/core/database",
    "crates/core/entity",
    "crates/core/migration", # 当前不完善, 以migration为主
    # "crates/core/migration_raw",
    "crates/core/inject",
    "crates/core/scheduler",
    "crates/core/utils",
    "crates/core/logger",
    "crates/core/cache",
    "crates/core/requests",

    # 组件
    "crates/app_state",
    # "crates/embed_asset", # 需要静态资源, 取消成员
    "crates/axum_response",
    "crates/axum_mock",
    "crates/axum_validator",
    "crates/axum_middleware",
    "crates/axum_session",
    "crates/axum_jwt",
    "crates/axum_context",
    "crates/grpc_api",
    "crates/timer",
    "crates/service_hub",

    # 应用
    "admin",
]


[workspace.dependencies]
# 插件
axum_validator = { path = "crates/axum_validator" }
axum_jwt = { path = "crates/axum_jwt" }
axum_context = { path = "crates/axum_context" }
axum_response = { path = "crates/axum_response" }
axum_middleware = { path = "crates/axum_middleware" }
axum_session = { path = "crates/axum_session" }

err_code = { path = "crates/core/err_code" }
database = { path = "crates/core/database" }
entity = { path = "crates/core/entity" }
migration = { path = "crates/core/migration" }
inject = { path = "crates/core/inject" }
utils = { path = "crates/core/utils" }
logger = { path = "crates/core/logger" }


# 网络相关
tokio = "1.48"
async-std = "1.13"
async-trait = "0.1"
axum = "0.8"
axum-extra = "0.12"
axum_typed_multipart = "0.16"
axum-test = "18.2"
axum_static = "1.7"
axum-prometheus = "0.9"
axum-streams = "0.24"
tower-sessions = "0.14"
tower = "0.5"
tower-http = "0.6"
tower_governor = "0.8"
tonic = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
tonic-prost = "0.14"
reqwest = "0.12"
validator = "0.20"
validator_derive = "0.20"
listenfd = "1.0"
num_cpus = "1.17"
tokio-cron-scheduler = "0.15"
http-body-util = "0.1"
serde_urlencoded = "0.7"
mime = "0.3"                  # mime type
infer = "0.19"                # mime

# 数据库
sea-orm = "1.1"
sea-orm-migration = "1.1"
sqlx = "0.8"


# 错误处理
thiserror = "2.0"
anyhow = "1.0"


# 日志
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
