# 加密
uuid = "1.18"
sha2 = "0.10"
base64 = "0.22"

# 工具
# contextchronoclap = "4.5"
toml = "0.9"
serde = "1.0"
serde_json = "1.0"
serde_repr = "0.1"
serde_yaml = "0.9"
strum = "0.27"
strum_macros = "0.27"
bincode = "2.0"
futures = "0.3"
nject = "0.4"
