[package]
name = "comfyui"
version = "0.1.0"
edition = "2021"

[dependencies]
database = { path = "../../core/database" }
entity = { path = "../../core/entity" }
code = { path = "../../core/code" }
inject = { path = "../../core/inject" }
utils = { path = "../../core/utils" }
axum_response = { path = "../../axum_response" }
axum_validator = { path = "../../axum_validator" }

axum = { workspace = true }
axum_typed_multipart = { workspace = true }
validator = { workspace = true, features = ["derive"] }
sea-orm = { workspace = true }
nject = { workspace = true }
reqwest = { workspace = true, features = [
    "blocking",
    "json",
    "multipart",
    "cookies",
    "rustls-tls",
] }
tokio = { workspace = true, features = [] }

tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_repr = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tempfile = { workspace = true }


[dev-dependencies]
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "test-util",
    "fs",
] }
anyhow = { workspace = true }
