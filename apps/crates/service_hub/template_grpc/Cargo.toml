[package]
name = "template_grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
utils = { path = "../../core/utils" }
grpc_api = { path = "../../grpc_api" }

entity = { workspace = true }
database = { workspace = true }
err_code = { workspace = true }
inject = { workspace = true }
axum_response = { workspace = true }
axum_validator = { workspace = true }

axum = { workspace = true }
axum-extra = { workspace = true, features = ["cookie-private", "typed-header"] }
tonic = { workspace = true }
sea-orm = { workspace = true }
validator = { workspace = true, features = ["derive"] }
nject = { workspace = true }
chrono = { workspace = true }

log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_repr = { workspace = true }


[dev-dependencies]
orm_migration = { path = "../../core/orm_migration" }

axum-test = { workspace = true }
axum_mock = { path = "../../axum_mock" }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "test-util",
] }
