[package]
name = "template"
version = "0.1.0"
edition = "2024"

[dependencies]
database = { workspace = true }
entity = { workspace = true }
migration = { workspace = true }
err_code = { workspace = true }
inject = { workspace = true }
utils = { workspace = true }
axum_response = { workspace = true }
axum_validator = { workspace = true }

axum = { workspace = true }
axum-extra = { workspace = true, features = ["cookie-private", "typed-header"] }
tonic = { workspace = true }
sea-orm = { workspace = true }
validator = { workspace = true, features = ["derive"] }
nject = { workspace = true }
chrono = { workspace = true }

log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_repr = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
axum_mock = { path = "../../axum_mock" }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "test-util",
] }
