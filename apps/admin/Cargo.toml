[package]
name = "admin"
version = "0.1.0"
edition = "2024"

[dependencies]
embed_asset = { path = "../crates/embed_asset" }
inject = { path = "../crates/core/inject" }
service_hub = { path = "../crates/service_hub" }
app_state = { path = "../crates/app_state" }

err_code = { workspace = true }
database = { workspace = true }
logger = { workspace = true }
utils = { workspace = true }
axum_response = { workspace = true }
axum_middleware = { workspace = true }
axum_session = { workspace = true }
axum_context = { workspace = true }

axum = { workspace = true }
axum-extra = { workspace = true, features = ["cookie-private"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower_governor = { workspace = true }
tower-http = { workspace = true, features = [
    "fs",
    "trace",
    "cors",
    "limit",
    "compression-gzip",
    "timeout",
    "util",
    "request-id",
] }
listenfd = { workspace = true }

tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dotenv = { workspace = true }
rust-embed = { workspace = true, features = [
    # "debug-embed",
    "include-exclude",
    "mime-guess",
] }
colored = { workspace = true }
